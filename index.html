<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>zdania4's Stuff, I guess</title>
  <style>
    /* Theme from blocklist */
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono&display=swap');
    html, body {
      margin: 0; padding: 0; height: 100%;
      background: #121212;
      color: #eee;
      font-family: 'JetBrains Mono', monospace;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    a {
      color: #07c;
      text-decoration: none;
    }
    a:hover, a:focus {
      color: #0af;
      text-decoration: underline;
    }
    header {
      padding: 2rem 1rem 1rem 1rem;
      text-align: center;
      border-bottom: 1px solid #222;
      font-weight: 700;
      font-size: 1.6rem;
      letter-spacing: 0.03em;
    }
    main {
      max-width: 720px;
      margin: 3rem auto 4rem auto;
      padding: 1.5rem 2rem;
      background: #1c1c1c;
      border-radius: 6px;
      box-shadow: 0 0 12px rgb(0 0 0 / 0.4);
    }
    h1 {
      margin-top: 0;
      font-size: 2rem;
      font-weight: 700;
      color: #0af;
      text-align: center;
      user-select: none;
    }
    p.description {
      font-size: 1rem;
      margin-bottom: 2rem;
      text-align: center;
      color: #bbb;
      line-height: 1.5;
    }
    ul.repo-list {
      list-style: none;
      padding-left: 0;
      margin: 0;
    }
    ul.repo-list li {
      margin-bottom: 1rem;
      font-size: 1.1rem;
      padding: 0.4rem 0.6rem;
      border-left: 3px solid #07c;
      transition: border-color 0.3s ease;
      user-select: text;
    }
    ul.repo-list li:hover {
      border-left-color: #0af;
    }
    ul.repo-list li a {
      color: inherit;
      font-weight: 600;
    }
    footer {
      text-align: center;
      color: #444;
      font-size: 0.9rem;
      margin-bottom: 1rem;
      user-select: none;
    }
  </style>
</head>
<body>
  <header>zdania4.github.io</header>
  <main>
    <h1>My Stuff, I guess...</h1>
    <p class="description">
      Welcome to my public projects and repositories.
    </p>
    <ul class="repo-list">
      <li><a href="https://github.com/zdania4/blocklist" target="_blank" rel="noopener noreferrer">blocklist</a> – My custom (NSFW!) blocklist project.</li>
      <li><a href="https://github.com/zdania4/bpmfinder" target="_blank" rel="noopener noreferrer">BPMFinder</a> – My BPMFinder written in Python.</li>
      <li><a href="https://github.com/zdania4" target="_blank" rel="noopener noreferrer">Full GitHub Profile</a> – Browse all repositories. Two are actually pretty good 😂</li>
    </ul>
  </main>
  <footer>☺</footer>
</body>
</html>
